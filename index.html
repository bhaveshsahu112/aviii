<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Avighna Belts | Coming Soon</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at top, #1a1a1a, #000);
      color: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 900px;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    /* Center Content */
    .content {
      animation: fadeUp 1.2s ease forwards;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #d4af37; /* Gold */
      margin-bottom: 30px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 52px;
      line-height: 1.2;
      margin-bottom: 20px;
    }

    h1 span {
      color: #d4af37;
    }

    .subtext {
      font-size: 18px;
      color: #cfcfcf;
      margin-bottom: 30px;
      max-width: 650px;
    }

    .launching {
      display: inline-block;
      padding: 10px 22px;
      border: 1px solid rgba(212, 175, 55, 0.6);
      color: #d4af37;
      font-weight: 500;
      letter-spacing: 1px;
      margin-bottom: 40px;
    }

    /* Countdown */
    .countdown {
      display: flex;
      gap: 20px;
      margin-bottom: 40px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .time-box {
      text-align: center;
      background: rgba(255, 255, 255, 0.05);
      padding: 16px 18px;
      border-radius: 8px;
      min-width: 80px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .time-box h2 {
      font-size: 28px;
      font-weight: 600;
      color: #d4af37;
    }

    .time-box span {
      font-size: 12px;
      letter-spacing: 1px;
      color: #aaa;
    }

    /* Social Icons */
    .socials {
      display: flex;
      gap: 20px;
    }

    .socials a {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #d4af37;
      border: 1px solid rgba(212, 175, 55, 0.5);
      transition: all 0.3s ease;
    }

    .socials a:hover {
      background: #d4af37;
      color: #000;
    }

    /* Background Visual Overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.9)),
        url('https://images.unsplash.com/photo-1601924928580-fb3f3b0a40c6?auto=format&fit=crop&w=1600&q=80');
      background-size: cover;
      background-position: center;
      z-index: -1;
    }

    /* Animations */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    /* Responsive */
    @media (max-width: 900px) {
      h1 {
        font-size: 38px;
      }
    }

      .content {
        order: 2;
      }

      .visual {
        order: 1;
        height: 380px;
      }

      .countdown {
        justify-content: center;
      }

      .socials {
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Left Content -->
    <div class="content">
      <div class="logo">AVIGHNA BELTS</div>

      <h1>Something <span>Powerful</span> Is Coming</h1>

      <p class="subtext">
        Premium belts crafted for style, strength & confidence.
        Designed for men who value detail, durability, and timeless elegance.
      </p>

      <div class="launching">LAUNCHING SOON</div>

      <!-- Countdown -->
      <div class="countdown" id="countdown">
        <div class="time-box">
          <h2 id="days">00</h2>
          <span>DAYS</span>
        </div>
        <div class="time-box">
          <h2 id="hours">00</h2>
          <span>HOURS</span>
        </div>
        <div class="time-box">
          <h2 id="minutes">00</h2>
          <span>MIN</span>
        </div>
        <div class="time-box">
          <h2 id="seconds">00</h2>
          <span>SEC</span>
        </div>
      </div>

      <div class="socials">
        <a href="#"><i class="fab fa-instagram"></i></a>
        <a href="#"><i class="fab fa-facebook-f"></i></a>
      </div>
    </div>

    
  </div>

<script>
  // Set launch date (YYYY-MM-DDTHH:MM:SS)
  const launchDate = new Date("2026-03-01T00:00:00").getTime();

  const timer = setInterval(() => {
    const now = new Date().getTime();
    const distance = launchDate - now;

    if (distance < 0) {
      clearInterval(timer);
      document.getElementById("countdown").innerHTML = "<span style='color:#d4af37'>We Are Live</span>";
      return;
    }

    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((distance % (1000 * 60)) / 1000);

    document.getElementById("days").innerText = String(days).padStart(2, '0');
    document.getElementById("hours").innerText = String(hours).padStart(2, '0');
    document.getElementById("minutes").innerText = String(minutes).padStart(2, '0');
    document.getElementById("seconds").innerText = String(seconds).padStart(2, '0');
  }, 1000);
</script>

</body>
</html>
